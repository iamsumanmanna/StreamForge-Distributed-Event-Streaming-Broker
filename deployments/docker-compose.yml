# StreamForge Distributed Event Streaming Broker — 3-node cluster
#
#   docker compose -f deployments/docker-compose.yml up --build
#   go run ./cmd/produce -addr 127.0.0.1:9092 -topic orders -partitions 3 -count 50
#   go run ./cmd/consume -addr 127.0.0.1:9092 -topic orders -group workers

services:
  broker-1:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: streamforge-broker:local
    container_name: sf-broker-1
    command:
      - "-id=broker-1"
      - "-listen=:9092"
      - "-http=:8080"
      - "-raft-bind=:7000"
      - "-data=/data"
      - "-cluster=true"
      - "-rf=3"
      - "-peers=broker-1=broker-1:7000,broker-2=broker-2:7000,broker-3=broker-3:7000"
    environment:
      SF_PEER_CLIENTS: "broker-1=broker-1:9092,broker-2=broker-2:9092,broker-3=broker-3:9092"
      SF_BOOTSTRAP: "true"
    ports:
      - "9092:9092"
      - "8080:8080"
    volumes:
      - sf_b1:/data
    restart: unless-stopped

  broker-2:
    image: streamforge-broker:local
    container_name: sf-broker-2
    depends_on:
      - broker-1
    command:
      - "-id=broker-2"
      - "-listen=:9092"
      - "-http=:8080"
      - "-raft-bind=:7000"
      - "-data=/data"
      - "-cluster=true"
      - "-rf=3"
      - "-peers=broker-1=broker-1:7000,broker-2=broker-2:7000,broker-3=broker-3:7000"
    environment:
      SF_PEER_CLIENTS: "broker-1=broker-1:9092,broker-2=broker-2:9092,broker-3=broker-3:9092"
    ports:
      - "9093:9092"
      - "8081:8080"
    volumes:
      - sf_b2:/data
    restart: unless-stopped

  broker-3:
    image: streamforge-broker:local
    container_name: sf-broker-3
    depends_on:
      - broker-1
    command:
      - "-id=broker-3"
      - "-listen=:9092"
      - "-http=:8080"
      - "-raft-bind=:7000"
      - "-data=/data"
      - "-cluster=true"
      - "-rf=3"
      - "-peers=broker-1=broker-1:7000,broker-2=broker-2:7000,broker-3=broker-3:7000"
    environment:
      SF_PEER_CLIENTS: "broker-1=broker-1:9092,broker-2=broker-2:9092,broker-3=broker-3:9092"
    ports:
      - "9094:9092"
      - "8082:8080"
    volumes:
      - sf_b3:/data
    restart: unless-stopped

volumes:
  sf_b1:
  sf_b2:
  sf_b3:
